<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Premium drop shadow for the cards and overlapping circles -->
    <filter id="shadow" x="0" y="4" width="280" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#101828" flood-opacity="0.09" />
    </filter>
    
    <filter id="circleShadow" x="70" y="80" width="140" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#101828" flood-opacity="0.12" />
    </filter>

    <linearGradient id="bgGrad" x1="40" y1="20" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2388FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Clean, subtle background glow -->
  <rect width="280" height="180" rx="12" fill="url(#bgGrad)" />

  <!-- LAYOUT / STACKED DOCUMENTS -->
  <g filter="url(#shadow)">
    
    <!-- SHEET 1 (Left): Color Palette (Tilted Left) -->
    <g transform="translate(26, 12) rotate(-6)">
      <rect x="0" y="0" width="115" height="115" rx="6" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1.25" />
      
      <!-- Palette Title -->
      <text x="8" y="16" fill="#101828" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="bold">Semantic (status) colors</text>
      
      <!-- Description placeholder lines -->
      <rect x="8" y="22" width="98" height="2.5" rx="0.5" fill="#EAECF0" />
      <rect x="8" y="27" width="76" height="2.5" rx="0.5" fill="#EAECF0" />
      
      <!-- Error Palette Section -->
      <rect x="8" y="36.5" width="45" height="3" rx="0.75" fill="#F2F4F7" />
      
      <!-- Swatches row 1 -->
      <!-- Red 50 -->
      <rect x="8" y="44" width="15" height="15" rx="3" fill="#FEE4E2" />
      <rect x="10" y="62" width="11" height="2" rx="0.5" fill="#D0D5DD" />
      <!-- Red 100 -->
      <rect x="27" y="44" width="15" height="15" rx="3" fill="#FECDCA" />
      <rect x="29" y="62" width="11" height="2" rx="0.5" fill="#D0D5DD" />
      <!-- Red 500 -->
      <rect x="46" y="44" width="15" height="15" rx="3" fill="#F04438" />
      <rect x="48" y="62" width="11" height="2" rx="0.5" fill="#D0D5DD" />
      
      <!-- Success Palette Section -->
      <rect x="68" y="36.5" width="38" height="3" rx="0.75" fill="#F2F4F7" />
      
      <!-- Green 50 -->
      <rect x="68" y="44" width="15" height="15" rx="3" fill="#ECFDF3" />
      <rect x="70" y="62" width="11" height="2" rx="0.5" fill="#D0D5DD" />
      <!-- Green 500 -->
      <rect x="87" y="44" width="15" height="15" rx="3" fill="#12B76A" />
      <rect x="89" y="62" width="11" height="2" rx="0.5" fill="#D0D5DD" />

      <!-- Blue Palette Section (Below) -->
      <!-- Blue 100 -->
      <rect x="8" y="74" width="15" height="15" rx="3" fill="#D1E9FF" />
      <rect x="10" y="92" width="11" height="2" rx="0.5" fill="#D0D5DD" />
      <!-- Blue 500 -->
      <rect x="27" y="74" width="15" height="15" rx="3" fill="#2388FF" />
      <rect x="29" y="92" width="11" height="2" rx="0.5" fill="#D0D5DD" />
    </g>

    <!-- SHEET 2 (Right): Traits & Attributes Checklist (Tilted Right) -->
    <g transform="translate(136, 16) rotate(5)">
      <rect x="0" y="0" width="115" height="115" rx="6" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1.25" />
      
      <!-- Title -->
      <text x="10" y="16" fill="#101828" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="bold">Select traits &amp; attributes</text>
      
      <!-- Column 1 -->
      <!-- Checkbox 1 -->
      <rect x="10" y="26" width="5.5" height="5.5" rx="1.5" stroke="#D0D5DD" stroke-width="0.75" />
      <rect x="19" y="27.5" width="28" height="3" rx="0.75" fill="#98A2B3" />
      <!-- Checkbox 2 -->
      <rect x="10" y="37" width="5.5" height="5.5" rx="1.5" stroke="#D0D5DD" stroke-width="0.75" />
      <rect x="19" y="38.5" width="24" height="3" rx="0.75" fill="#98A2B3" />
      <!-- Checkbox 3 (Checked) -->
      <rect x="10" y="48" width="5.5" height="5.5" rx="1.5" fill="#2388FF" />
      <path d="M11.5 50.5L12.5 51.5L14.5 49.5" stroke="#FFFFFF" stroke-width="0.75" />
      <rect x="19" y="49.5" width="32" height="3" rx="0.75" fill="#101828" />
      <!-- Checkbox 4 -->
      <rect x="10" y="59" width="5.5" height="5.5" rx="1.5" stroke="#D0D5DD" stroke-width="0.75" />
      <rect x="19" y="60.5" width="36" height="3" rx="0.75" fill="#98A2B3" />
      <!-- Checkbox 5 -->
      <rect x="10" y="70" width="5.5" height="5.5" rx="1.5" stroke="#D0D5DD" stroke-width="0.75" />
      <rect x="19" y="71.5" width="26" height="3" rx="0.75" fill="#98A2B3" />

      <!-- Column 2 -->
      <!-- Checkbox 1 -->
      <rect x="62" y="26" width="5.5" height="5.5" rx="1.5" stroke="#D0D5DD" stroke-width="0.75" />
      <rect x="71" y="27.5" width="28" height="3" rx="0.75" fill="#98A2B3" />
      <!-- Checkbox 2 -->
      <rect x="62" y="37" width="5.5" height="5.5" rx="1.5" stroke="#D0D5DD" stroke-width="0.75" />
      <rect x="71" y="38.5" width="24" height="3" rx="0.75" fill="#98A2B3" />
      <!-- Checkbox 3 (Checked) -->
      <rect x="62" y="48" width="5.5" height="5.5" rx="1.5" fill="#2388FF" />
      <path d="M63.5 50.5L64.5 51.5L66.5 49.5" stroke="#FFFFFF" stroke-width="0.75" />
      <rect x="71" y="49.5" width="30" height="3" rx="0.75" fill="#101828" />
      <!-- Checkbox 4 -->
      <rect x="62" y="59" width="5.5" height="5.5" rx="1.5" stroke="#D0D5DD" stroke-width="0.75" />
      <rect x="71" y="60.5" width="34" height="3" rx="0.75" fill="#98A2B3" />
    </g>

    <!-- SHEET 3 (Bottom): UI Typeface Showcase Card (Tilted Slightly) -->
    <g transform="translate(48, 102) rotate(-2)">
      <rect x="0" y="0" width="182" height="46" rx="6" fill="#1D2939" stroke="#344054" stroke-width="1.25" />
      
      <!-- Header text -->
      <text x="10" y="10" fill="#98A2B3" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="bold">EXCELLENT UI TYPEFACES</text>
      
      <!-- Typeface items -->
      <!-- Item 1: Alegreya -->
      <rect x="8" y="15" width="39" height="24" rx="3.5" fill="#344054" />
      <text x="27.5" y="29.5" fill="#FFFFFF" font-family="Georgia, serif" font-size="8.5" font-weight="bold" text-anchor="middle">Alegreya</text>
      
      <!-- Item 2: Bespoke Serif -->
      <rect x="51" y="15" width="39" height="24" rx="3.5" fill="#344054" />
      <text x="70.5" y="29" fill="#FEE4E2" font-family="Times New Roman, serif" font-style="italic" font-size="8.5" text-anchor="middle">Bespoke</text>
      
      <!-- Item 3: Lora -->
      <rect x="94" y="15" width="39" height="24" rx="3.5" fill="#344054" />
      <text x="113.5" y="29" fill="#FFFFFF" font-family="Georgia, serif" font-size="8.5" text-anchor="middle">Lora</text>
      
      <!-- Item 4: Merriweather -->
      <rect x="137" y="15" width="37" height="24" rx="3.5" fill="#344054" />
      <text x="155.5" y="29" fill="#A3E2D7" font-family="Times New Roman, serif" font-size="7.5" font-weight="bold" text-anchor="middle">Merri</text>
    </g>

  </g>

  <!-- OVERLAPPING CIRCLES IN FOREGROUND (Notion & Figma) -->
  <g filter="url(#circleShadow)">
    
    <!-- Left Circle: Notion Icon -->
    <circle cx="112" cy="120" r="28" fill="#FFFFFF" />
    <!-- Notion cube drawing -->
    <rect x="102" y="110" width="20" height="20" rx="4.5" fill="#FFFFFF" stroke="#101828" stroke-width="2.5" />
    <path d="M102 110 L108.5 110 L102 116.5 Z" fill="#101828" />
    <!-- Letter N -->
    <rect x="106" y="114" width="2.5" height="11" fill="#101828" />
    <rect x="113.5" y="114" width="2.5" height="11" fill="#101828" />
    <path d="M108 114 L113.5 124.5 L115.5 124 L109.5 114 Z" fill="#101828" />
    
    <!-- Right Circle: Figma Icon -->
    <circle cx="162" cy="120" r="28" fill="#FFFFFF" />
    <!-- Figma colored blobs -->
    <g transform="translate(162, 120)">
      <!-- Red (top-left) -->
      <circle cx="-4" cy="-8" r="4" fill="#F24E1E" />
      <!-- Orange (top-right) -->
      <circle cx="4" cy="-8" r="4" fill="#FF7262" />
      <!-- Purple (mid-left) -->
      <circle cx="-4" cy="0" r="4" fill="#A259FF" />
      <!-- Blue (mid-right) -->
      <circle cx="4" cy="0" r="4" fill="#1ABC9C" />
      <!-- Green (bottom-left) -->
      <path d="M-8 8 A4 4 0 0 1 -4 4 L-4 12 A4 4 0 0 1 -8 8 Z" fill="#0ACF83" />
    </g>

  </g>
</svg>
