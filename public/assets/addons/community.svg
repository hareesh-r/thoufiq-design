<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Premium drop shadow for the cards and overlapping circles -->
    <filter id="shadow" x="0" y="4" width="280" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#101828" flood-opacity="0.09" />
    </filter>
    
    <filter id="circleShadow" x="70" y="80" width="140" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#101828" flood-opacity="0.12" />
    </filter>

    <linearGradient id="bgGrad" x1="40" y1="20" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Clean, subtle background glow -->
  <rect width="280" height="180" rx="12" fill="url(#bgGrad)" />

  <!-- LAYOUT / STACKED DOCUMENTS -->
  <g filter="url(#shadow)">
    
    <!-- SHEET 1 (Left): Chat UI Mockup (Tilted Left) -->
    <g transform="translate(32, 14) rotate(-6)">
      <!-- Card Base -->
      <rect x="0" y="0" width="105" height="125" rx="6" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1.25" />
      
      <!-- App Sidebar panel -->
      <rect x="0" y="0" width="28" height="125" rx="6" fill="#F2F4F7" />
      <!-- Clip-path/mask would be clean, but simple rect overlay is fine -->
      <rect x="22" y="0" width="6" height="125" fill="#F2F4F7" />
      
      <!-- Sidebar channel icons -->
      <circle cx="14" cy="16" r="6" fill="#5865F2" />
      <rect x="6" y="28" width="16" height="3.5" rx="1" fill="#D0D5DD" />
      <rect x="6" y="38" width="16" height="3.5" rx="1" fill="#D0D5DD" />
      <rect x="6" y="48" width="16" height="3.5" rx="1" fill="#D0D5DD" />
      <rect x="6" y="58" width="16" height="3.5" rx="1" fill="#D0D5DD" />

      <!-- Chat Feed area -->
      <!-- Message 1 -->
      <circle cx="38" cy="18" r="5" fill="#E23A8C" />
      <rect x="47" y="12" width="48" height="18" rx="3.5" fill="#F5FAFF" stroke="#D1E9FF" stroke-width="0.5" />
      <rect x="52" y="17" width="38" height="2" rx="0.5" fill="#2388FF" />
      <rect x="52" y="22" width="28" height="2" rx="0.5" fill="#2388FF" />
      
      <!-- Message 2 -->
      <circle cx="38" cy="44" r="5" fill="#2388FF" />
      <rect x="47" y="38" width="48" height="24" rx="3.5" fill="#F8F9FA" stroke="#EAECF0" stroke-width="0.5" />
      <rect x="52" y="43" width="38" height="2" rx="0.5" fill="#344054" />
      <rect x="52" y="48" width="38" height="2" rx="0.5" fill="#344054" />
      <rect x="52" y="53" width="22" height="2" rx="0.5" fill="#344054" />
      
      <!-- Message 2 Reaction Pill -->
      <rect x="47" y="66" width="14" height="8" rx="2.5" fill="#FEE4E2" stroke="#FECDCA" stroke-width="0.5" />
      <path d="M54 71.5L53.4 71.0C51.5 69.3 50.2 68.2 50.2 66.8C50.2 65.7 51.0 64.9 52.1 64.9C52.7 64.9 53.3 65.2 54 65.7C54.7 65.2 55.3 64.9 55.9 64.9C57.0 64.9 57.8 65.7 57.8 66.8C57.8 68.2 56.5 69.3 54.6 71.0L54 71.5Z" fill="#F04438" />

      <!-- Message 3 -->
      <circle cx="38" cy="86" r="5" fill="#FF5733" />
      <rect x="47" y="80" width="48" height="18" rx="3.5" fill="#F8F9FA" stroke="#EAECF0" stroke-width="0.5" />
      <rect x="52" y="85" width="38" height="2" rx="0.5" fill="#344054" />
      <rect x="52" y="90" width="26" height="2" rx="0.5" fill="#344054" />
    </g>

    <!-- SHEET 2 (Right): Critique Board & Feedback (Tilted Right) -->
    <g transform="translate(142, 16) rotate(5)">
      <!-- Card Base -->
      <rect x="0" y="0" width="105" height="125" rx="6" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1.25" />
      
      <!-- Critique Header -->
      <rect x="10" y="10" width="55" height="6" rx="1.5" fill="#EAECF0" />
      
      <!-- Design mockup snippet being commented on -->
      <rect x="10" y="24" width="85" height="42" rx="4" fill="#F2F4F7" />
      <rect x="14" y="28" width="77" height="34" rx="2" stroke="#D0D5DD" stroke-dasharray="2 2" stroke-width="1" fill="none" />
      <!-- Big green check overlay -->
      <path d="M47 43.5L50.5 47L57.5 40" stroke="#12B76A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Feedback rows (Users pointing out edits) -->
      <!-- Item 1 -->
      <circle cx="16" cy="80" r="4.5" fill="#7B2CBF" />
      <rect x="26" y="76" width="60" height="3.5" rx="0.75" fill="#98A2B3" />
      <rect x="26" y="82" width="45" height="3.5" rx="0.75" fill="#D0D5DD" />
      
      <!-- Item 2 -->
      <circle cx="16" cy="94" r="4.5" fill="#1ABC9C" />
      <rect x="26" y="90" width="65" height="3.5" rx="0.75" fill="#98A2B3" />
      <rect x="26" y="96" width="35" height="3.5" rx="0.75" fill="#D0D5DD" />
      
      <!-- Item 3 -->
      <circle cx="16" cy="108" r="4.5" fill="#FDB022" />
      <rect x="26" y="104" width="52" height="3.5" rx="0.75" fill="#98A2B3" />
    </g>

  </g>

  <!-- OVERLAPPING CIRCLES IN FOREGROUND -->
  <g filter="url(#circleShadow)">
    
    <!-- Left Circle: Discord Icon -->
    <circle cx="112" cy="120" r="28" fill="#FFFFFF" />
    <circle cx="112" cy="120" r="24" fill="#5865F2" />
    <!-- White Discord Logo Shape (Centered & Translated) -->
    <g transform="translate(-3, 3)">
      <path d="M123.6 112.5C122.5 111.4 121.2 110.7 119.8 110.3C119.5 110.9 119.2 111.7 119 112.3C117.4 112 115.8 111.9 114.2 111.9C112.6 111.9 111 112 109.4 112.3C109.2 111.7 108.8 110.9 108.6 110.3C107.1 110.7 105.8 111.4 104.7 112.5C102.5 115.8 101.9 119 102.2 122.2C103.7 123.3 105.1 124 106.6 124.5C106.9 124.1 107.2 123.6 107.5 123.1C107 122.9 106.5 122.7 106 122.4C106.1 122.3 106.2 122.2 106.3 122.1C109.2 123.5 112.4 124.2 115.6 124.2C118.8 124.2 122 123.5 124.9 122.1C125 122.2 125.1 122.3 125.2 122.4C124.7 122.7 124.2 122.9 123.7 123.1C124 123.6 124.3 124.1 124.6 124.5C126.1 124 127.6 123.3 129.1 122.2C129.5 118.4 128.4 115.2 123.6 112.5ZM110.7 119.7C109.7 119.7 108.9 118.8 108.9 117.7C108.9 116.6 109.7 115.7 110.7 115.7C111.7 115.7 112.5 116.6 112.5 117.7C112.5 118.8 111.7 119.7 110.7 119.7ZM120.3 119.7C119.3 119.7 118.5 118.8 118.5 117.7C118.5 116.6 119.3 115.7 120.3 115.7C121.3 115.7 122.1 116.6 122.1 117.7C122.1 118.8 121.3 119.7 120.3 119.7Z" fill="#FFFFFF" />
    </g>
    
    <!-- Right Circle: Slack Icon -->
    <circle cx="162" cy="120" r="28" fill="#FFFFFF" />
    <!-- Slack Logo Pattern centered around (162, 120) -->
    <g transform="translate(162, 120)">
      <!-- Top (Blue) -->
      <rect x="-3.5" y="-12" width="7" height="9" rx="3.5" fill="#36C5F0" />
      <circle cx="7" cy="-7.5" r="3.5" fill="#36C5F0" />
      <!-- Right (Green) -->
      <rect x="3" y="-3.5" width="9" height="7" rx="3.5" fill="#2EB67D" />
      <circle cx="7.5" cy="7" r="3.5" fill="#2EB67D" />
      <!-- Bottom (Yellow) -->
      <rect x="-3.5" y="3" width="7" height="9" rx="3.5" fill="#ECB22E" />
      <circle cx="-7" cy="7.5" r="3.5" fill="#ECB22E" />
      <!-- Left (Red) -->
      <rect x="-12" y="-3.5" width="9" height="7" rx="3.5" fill="#E01E5A" />
      <circle cx="-7.5" cy="-7" r="3.5" fill="#E01E5A" />
    </g>

  </g>
</svg>
