<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Premium drop shadow for the cards and overlapping circles -->
    <filter id="shadow" x="0" y="4" width="280" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#101828" flood-opacity="0.09" />
    </filter>
    
    <filter id="circleShadow" x="70" y="80" width="140" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#101828" flood-opacity="0.12" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="zoomGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D8CFF" />
      <stop offset="100%" stop-color="#1254A8" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="40" y1="20" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2388FF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#2388FF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Clean, subtle background workspace glow -->
  <rect width="280" height="180" rx="12" fill="url(#bgGrad)" />

  <!-- LAYOUT / STACKED DOCUMENTS -->
  <g filter="url(#shadow)">
    
    <!-- SHEET 1 (Left): Portfolio Case Study Review (Tilted Left) -->
    <g transform="translate(32, 14) rotate(-6)">
      <!-- Card Base -->
      <rect x="0" y="0" width="105" height="125" rx="6" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1.25" />
      
      <!-- Card Header -->
      <rect x="10" y="10" width="45" height="6" rx="1.5" fill="#E4E7EC" />
      
      <!-- Green Approved Status Badge -->
      <rect x="68" y="9" width="27" height="8" rx="4" fill="#ECFDF3" />
      <text x="81.5" y="15" fill="#039855" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="bold" text-anchor="middle">APPROVED</text>
      
      <!-- Wireframe Project Canvas Preview -->
      <rect x="10" y="24" width="85" height="38" rx="3.5" fill="#F8F9FA" stroke="#F2F4F7" stroke-width="1" />
      <!-- Wireframe details (diagonal lines) -->
      <line x1="10" y1="24" x2="95" y2="62" stroke="#EAECF0" stroke-width="0.75" />
      <line x1="95" y1="24" x2="10" y2="62" stroke="#EAECF0" stroke-width="0.75" />
      <circle cx="52.5" cy="43" r="6" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1" />
      
      <!-- Text Description Rows -->
      <rect x="10" y="70" width="85" height="4.5" rx="1" fill="#EAECF0" />
      <rect x="10" y="78" width="70" height="4.5" rx="1" fill="#EAECF0" />
      <rect x="10" y="86" width="78" height="4.5" rx="1" fill="#EAECF0" />
      
      <!-- Feedback Sticky Comment -->
      <rect x="10" y="98" width="85" height="18" rx="3" fill="#FFFAEB" stroke="#FEDF89" stroke-width="0.75" />
      <!-- Star and small comment text -->
      <path d="M17 104L18.2 106.5L21 106.9L19 108.8L19.5 111.5L17 110.2L14.5 111.5L15 108.8L13 106.9L15.8 106.5L17 104Z" fill="#FDB022" />
      <rect x="25" y="104" width="62" height="3" rx="0.75" fill="#FEDF89" />
      <rect x="25" y="109" width="48" height="3" rx="0.75" fill="#FEDF89" />
    </g>

    <!-- SHEET 2 (Right): Weekly Mentorship Schedule (Tilted Right) -->
    <g transform="translate(142, 16) rotate(5)">
      <!-- Card Base -->
      <rect x="0" y="0" width="105" height="125" rx="6" fill="#FFFFFF" stroke="#EAECF0" stroke-width="1.25" />
      
      <!-- Header Badge -->
      <rect x="10" y="10" width="68" height="8" rx="2.5" fill="#E8F4FF" />
      <text x="44" y="16" fill="#2388FF" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="bold" text-anchor="middle">WEEKLY TIMELINE</text>
      
      <!-- Slot 1 (Monday 1:1 Review) -->
      <rect x="10" y="26" width="85" height="26" rx="4" fill="#F8F9FA" stroke="#EAECF0" stroke-width="0.75" />
      <rect x="16" y="32" width="35" height="5" rx="1.5" fill="#344054" />
      <rect x="16" y="41" width="50" height="4" rx="1" fill="#98A2B3" />
      <!-- Time pill -->
      <rect x="68" y="32" width="22" height="6" rx="3" fill="#E0F2FE" />
      <text x="79" y="36.5" fill="#2388FF" font-family="system-ui, -apple-system, sans-serif" font-size="4" font-weight="bold" text-anchor="middle">10 AM</text>
      
      <!-- Slot 2 (Wednesday Group Call) -->
      <rect x="10" y="58" width="85" height="26" rx="4" fill="#F5FAFF" stroke="#D1E9FF" stroke-width="0.75" />
      <rect x="16" y="64" width="45" height="5" rx="1.5" fill="#2388FF" />
      <rect x="16" y="73" width="40" height="4" rx="1" fill="#53B1FD" />
      <!-- Time pill -->
      <rect x="68" y="64" width="22" height="6" rx="3" fill="#E0F2FE" />
      <text x="79" y="68.5" fill="#2388FF" font-family="system-ui, -apple-system, sans-serif" font-size="4" font-weight="bold" text-anchor="middle">06 PM</text>
      
      <!-- Slot 3 (Friday Q&A) -->
      <rect x="10" y="90" width="85" height="26" rx="4" fill="#F8F9FA" stroke="#EAECF0" stroke-width="0.75" />
      <rect x="16" y="96" width="30" height="5" rx="1.5" fill="#344054" />
      <rect x="16" y="105" width="44" height="4" rx="1" fill="#98A2B3" />
      <!-- Time pill -->
      <rect x="68" y="96" width="22" height="6" rx="3" fill="#F2F4F7" />
      <text x="79" y="100.5" fill="#475467" font-family="system-ui, -apple-system, sans-serif" font-size="4" font-weight="bold" text-anchor="middle">04 PM</text>
    </g>

  </g>

  <!-- OVERLAPPING CIRCLES IN FOREGROUND -->
  <g filter="url(#circleShadow)">
    
    <!-- Left Circle: Zoom Video Call Icon -->
    <circle cx="112" cy="120" r="28" fill="#FFFFFF" />
    <circle cx="112" cy="120" r="24" fill="url(#zoomGrad)" />
    <!-- White Zoom Camera -->
    <rect x="99" y="114" width="16" height="12" rx="2" fill="#FFFFFF" />
    <polygon points="115,117 125,111 125,129 115,123" fill="#FFFFFF" stroke-linejoin="round" />
    
    <!-- Right Circle: Google Calendar Icon -->
    <circle cx="162" cy="120" r="28" fill="#FFFFFF" />
    <!-- Mini Calendar Mockup -->
    <!-- Blue header -->
    <path d="M150 106 H174 C176.2 106 178 107.8 178 110 V114 H146 V110 C146 107.8 147.8 106 150 106 Z" fill="#2388FF" />
    <!-- Body -->
    <path d="M146 114 H178 V130 C178 132.2 176.2 134 174 134 H150 C147.8 134 146 132.2 146 130 Z" fill="#F8F9FA" stroke="#D0D5DD" stroke-width="1" />
    <text x="162" y="129" fill="#101828" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">31</text>
    <!-- Calendar rings -->
    <rect x="152" y="103" width="2" height="6" rx="1" fill="#98A2B3" />
    <rect x="170" y="103" width="2" height="6" rx="1" fill="#98A2B3" />

  </g>
</svg>
