<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#080C18"/>

  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080C18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo0" x1="7" y1="0" x2="7" y2="22.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0039C0"/>
      <stop offset="0.899" stop-color="white"/>
      <stop offset="1" stop-color="#0039C0"/>
    </linearGradient>
    <linearGradient id="logo1" x1="21" y1="33" x2="21" y2="45.375" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0039C0"/>
      <stop offset="0.899" stop-color="white"/>
      <stop offset="1" stop-color="#0039C0"/>
    </linearGradient>
    <linearGradient id="logo2" x1="23" y1="0" x2="23" y2="12.375" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0039C0"/>
      <stop offset="0.899" stop-color="white"/>
      <stop offset="1" stop-color="#0039C0"/>
    </linearGradient>
    <linearGradient id="logo3" x1="7" y1="0" x2="7" y2="22.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0039C0"/>
      <stop offset="0.899" stop-color="white"/>
      <stop offset="1" stop-color="#0039C0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(570, 170) scale(2)">
    <rect width="14" height="20" rx="2" fill="url(#logo0)"/>
    <rect x="14" y="33" width="14" height="11" rx="2" transform="rotate(180 14 33)" fill="url(#logo1)"/>
    <rect x="16" width="14" height="11" rx="2" fill="url(#logo2)"/>
    <rect width="14" height="20" rx="2" transform="matrix(1 0 0 -1 16 33)" fill="url(#logo3)"/>
  </g>

  <text x="600" y="310" text-anchor="middle" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="52" fill="#FFFFFF">Grid and Goal</text>

  <text x="600" y="365" text-anchor="middle" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-weight="400" font-size="26" fill="#FFFFFF" fill-opacity="0.6">Your Design Journey Begins</text>

  <line x1="520" y1="395" x2="680" y2="395" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>

  <text x="600" y="440" text-anchor="middle" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-weight="500" font-size="22" fill="#FFFFFF" fill-opacity="0.85">Not Another UI/UX Course -</text>
  <text x="600" y="472" text-anchor="middle" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-weight="500" font-size="22" fill="#FFFFFF" fill-opacity="0.85">60-day structured program</text>

  <rect x="475" y="505" width="250" height="36" rx="18" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="529" text-anchor="middle" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-weight="500" font-size="14" fill="#7AA8FF">Second Batch - Limited Seats</text>
